<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mənim Anbarım</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        button {
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            box-shadow: 0 2px 8px #ddd;
        }

        button:active {
            transform: scale(0.98);
        }

        .welcome {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>📦 MƏNİM ANBARIM</h1>
    <p>Anbar və Arenda İdarəetmə Sistemi</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>Xoş gəlmisən 👋</h2>
        <p>Buradan anbarını idarə edə bilərsən.</p>
    </div>

    <div class="menu">

        <button>📦 Məhsullar</button>

        <button>📥 Mədaxil</button>

        <button>📤 Məxaric</button>

        <button>🤝 Arenda</button>

        <button>💰 Maliyyə</button>

        <button>📊 Hesabatlar</button>

    </div>

</div>

</body>
</html>
